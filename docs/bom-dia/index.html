    @keyframes letter-flight{0%{opacity:.2;transform:translate3d(var(--letter-from-x),var(--letter-from-y),0) scale(.14) rotate(12deg)}64%{opacity:1;transform:translate3d(0,-9px,0) scale(1.025) rotate(-1.2deg)}100%{opacity:1;transform:translate3d(0,0,0) scale(1) rotate(-.4deg)}}@keyframes confetti-fall{0%{opacity:0;transform:translate3d(0,-18px,0) rotate(0)}12%{opacity:.72}82%{opacity:.52}100%{opacity:0;transform:translate3d(var(--confetti-drift),105vh,0) rotate(var(--confetti-spin))}}@keyframes heart-float{0%{opacity:0;transform:translate(-50%,-50%) scale(.45) rotate(-8deg)}20%{opacity:.9}100%{opacity:0;transform:translate(calc(-50% + var(--heart-x)) ,calc(-50% + var(--heart-y))) scale(1.15) rotate(var(--heart-rotate))}}
    @keyframes spark-heart-beat{0%,100%{transform:scale(1);filter:drop-shadow(0 0 3px rgba(255,104,146,.32))}18%{transform:scale(1.22)}34%{transform:scale(1)}50%{transform:scale(1.14);filter:drop-shadow(0 0 9px rgba(255,104,146,.72))}68%{transform:scale(1)}}@keyframes twinkle{to{opacity:.25;transform:scale(.7)}}@keyframes rays{to{transform:rotate(360deg)}}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 420px))}}@keyframes reveal{to{opacity:1;transform:none}}@keyframes fade{to{opacity:1}}@keyframes pulse{50%{transform:scale(1.06)}}

  <script>
    const letters={
      19:{text:'meio atrasado, pq vc já trabalhou antes dele chegar kkkkk. A essa hora vc provavelmente já ouviu seu nome umas 40 vezes, pediu pra alguém sentar outras 20 e voltou pra casa querendo pelo menos 5 minutos sem ninguém falando. Ent aproveita esse intervalo pra comer alguma coisa, ficar quietinha e recuperar a bateria antes da próxima rota. Espero que as crianças tenham colaborado pelo menos uns 3% hoje kkkkk',sign:'eu te amo muito! ❤️',love:true},
      20:{text:'Tem muito esforço seu que ninguém vê, mas isso n faz ele valer menos. Vc continua sendo uma mulher foda, inteligente e dedicada até nos dias em que só vc sabe o quanto custou continuar.',sign:'Que hoje seja mais leve com vc.'},
      21:{title:'Bom dia meu Amorzinho!',text:'Eu queria começar essa cartinha dizendo o quão incrível você é, incrível por vários fatores, incrível por ser forte, incrível por ser amável, incrível por ser única, incrível por ser autêntica, incrível por ser incrível, incrível pelo jeito de se portar, incrível pelo jeito de agir, incrível pelo simples fato de existir. (Sim, até sua existência é incrível.)\n\nAmo o seu jeito autentico, animado, descontraído, meigo, você consegue deixar as coisas tão leve simplesmente por ser você.\n\nSabe o pior? que isso não é nem o início. Além de ter todas essas qualidades, vc ainda consegue ser INCRIVELMENTE LINDA. Amo seu cabelo, sim, do primeiro até o último fio, o formato do seu rosto, seu nariz, sua boca e cada detalhe que faz vc ser vc. Até as melequinhas entram no pacote kkkkkk. Mesmo quando vc não se sente tão segura com sua aparência, quero que saiba que, pra mim, vc continua linda por completo.\n\nDito isso, gostaria de dizer o quão importante você é pra mim, apesar das merdas que eu fiz de querer te afastar, ter você por perto faz meus olhos brilharem, sua presença é essencial pra minha felicidade, ver você feliz, sorrindo me deixa automaticamente bem, espero que seja assim por muito tempo, amo acordar e ver você linda e incrivel todos os dias, radiante como sempre. TE AMO!\n\nEnfim, queria digitar mais coisas, mas eu sei que seu tempo vai tá corrido, além das palavras espero conseguir demonstrar com atitudes o quanto eu te amo, bom dia meu amor! bom trabalho! você é incrivel!',sign:'TE AMO!',love:true,animatedHeart:true},
      22:{text:'Hoje é sábado. Então fica oficialmente permitido n resolver a vida inteira antes do almoço. Descansa a cabeça, aproveita o que der e deixa o resto esperar um pouco.',sign:'Vc também merece dias sem cobrança.'},
      23:{text:'Domingo n precisa render pra ser um dia bom. Se hoje só der pra respirar, organizar algumas coisas e ficar em paz, já tá ótimo. Nem todo dia precisa provar alguma coisa.',sign:'Vai com calma hoje.'},
      24:{text:'Segunda costuma chegar fazendo barulho, então aqui vai uma coisa simples: começa pelo que tá na sua frente. Vc n precisa ter todas as respostas agora, só precisa dar o primeiro passo.',sign:'E capacidade pra isso vc tem de sobra.'},
      25:{text:'Caso o dia tente fazer vc duvidar de si, lembra que cansaço n é falta de capacidade. Vc pode estar cansada e ainda continuar sendo inteligente, forte e muito boa no que faz.',sign:'N confunde um momento ruim com quem vc é.'},
      26:{text:'Nem tudo precisa sair perfeito pra ter sido bem feito. Vc se cobra como se qualquer erro apagasse todo o resto, mas n apaga. Seu esforço, sua inteligência e tudo que vc já conseguiu continuam aí.',sign:'Se trata com a mesma paciência que oferece pros outros.'},
      27:{text:'Se o plano mudar hoje, n significa que o dia deu errado. Às vezes vc só encontrou outro caminho. Se adapta, respira e segue , isso também é saber o que tá fazendo.',sign:'Confia mais em vc.'},
      28:{text:'Chegou sexta de novo. Espero que hoje o relógio colabore, o trabalho n invente moda e vc consiga terminar o dia com a sensação de que fez o que dava , porque isso já é suficiente.',sign:'Que apareça um motivo inesperado pra sorrir.'},
      29:{text:'Sua inteligência n aparece só quando vc acerta. Ela aparece no jeito que vc aprende, percebe detalhes, muda de ideia e tenta de novo. É isso que faz vc ser tão capaz de verdade.',sign:'N esquece disso hoje.'},
      30:{text:'Último domingo do mês. N precisa transformar isso numa contagem do que faltou fazer. Olha também pro tanto de coisa que vc atravessou, resolveu e aprendeu sem nem perceber.',sign:'Seu mês foi maior que a sua lista de tarefas.'},
      31:{text:'Agosto acaba hoje, mas esses lembretes n vencem junto com o mês: vc continua sendo foda, inteligente e capaz. Que setembro encontre vc confiando um pouco mais na pessoa que já é.',sign:'Fim do calendário, n dos lembretes. ☀️'}
    };
    const morning=document.getElementById('morning'),opening=document.getElementById('opening'),screen=document.getElementById('calendar-screen'),grid=document.getElementById('calendar-grid'),note=document.getElementById('locked-note'),modal=document.getElementById('letter-modal');
    const now=new Date(),todayKey=now.getFullYear()*10000+(now.getMonth()+1)*100+now.getDate();
    const unlockedDays=Object.keys(letters).map(Number).filter(day=>todayKey>=20260800+day);
    function buildCalendar(){
      for(let i=0;i<5;i++){const blank=document.createElement('span');blank.className='day-card empty';grid.appendChild(blank)}
      for(let day=1;day<=31;day++){
        const button=document.createElement('button');button.className='day-card';button.type='button';button.innerHTML=`<span class="day-number">${day}</span>`;
        if(day<19){button.classList.add('old');button.setAttribute('aria-label',`${day} de agosto, antes das cartinhas`)}
        else{const key=20260800+day,isOpen=todayKey>=key;button.classList.add('letter',isOpen?'open':'locked');button.setAttribute('aria-label',`${day} de agosto, cartinha ${isOpen?'aberta':'trancada'}`);button.innerHTML+=isOpen?'<span class="day-label">abrir carta</span>':'<span class="lock">⌁</span><span class="day-label">ainda dormindo</span>';if(todayKey===key)button.classList.add('today');button.addEventListener('click',()=>isOpen?openLetter(day,button):showLocked(day))}grid.appendChild(button)
      }
      document.getElementById('progress').textContent=`${Math.min(unlockedDays.length,13)} de 13 abertas`;
    }
    const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches,celebration=document.getElementById('celebration-layer');
    function launchHearts(source){if(reduceMotion)return;const rect=source.getBoundingClientRect(),x=rect.left+rect.width/2,y=rect.top+rect.height/2,colors=['#d86e8c','#f2a0b6','#e8ad58'];for(let i=0;i<7;i++){const heart=document.createElement('span');heart.className='click-heart';heart.textContent=i%3?'♡':'♥';heart.style.left=`${x}px`;heart.style.top=`${y}px`;heart.style.setProperty('--heart-color',colors[i%colors.length]);heart.style.setProperty('--heart-size',`${14+Math.random()*12}px`);heart.style.setProperty('--heart-x',`${-62+Math.random()*124}px`);heart.style.setProperty('--heart-y',`${-62-Math.random()*76}px`);heart.style.setProperty('--heart-rotate',`${-24+Math.random()*48}deg`);document.body.appendChild(heart);setTimeout(()=>heart.remove(),1050)}}
    function launchConfetti(){celebration.replaceChildren();if(reduceMotion)return;const colors=['#e98aa5','#f4b7a5','#e8ad58','#fff3c9','#b8cfb6'];for(let i=0;i<18;i++){const bit=document.createElement('span'),leftSide=i%2===0;bit.className='confetti-bit';bit.style.left=`${leftSide?3+Math.random()*15:82+Math.random()*15}%`;bit.style.setProperty('--confetti-color',colors[i%colors.length]);bit.style.setProperty('--fall-time',`${2.7+Math.random()*1.35}s`);bit.style.setProperty('--fall-delay',`${Math.random()*.55}s`);bit.style.setProperty('--confetti-drift',`${-28+Math.random()*56}px`);bit.style.setProperty('--confetti-spin',`${240+Math.random()*440}deg`);celebration.appendChild(bit)}}
    function openLetter(day,source){const data=letters[day],rect=source.getBoundingClientRect();modal.style.setProperty('--letter-from-x',`${rect.left+rect.width/2-innerWidth/2}px`);modal.style.setProperty('--letter-from-y',`${rect.top+rect.height/2-innerHeight/2}px`);document.getElementById('letter-date').textContent=`${day} de agosto de 2026`;const title=document.getElementById('letter-title');title.textContent=data.title||'Bom dia, Amorzinho.';document.getElementById('letter-text').textContent=data.text;const sign=document.getElementById('letter-sign');sign.textContent=data.sign;sign.classList.toggle('is-love',Boolean(data.love));if(data.animatedHeart){for(const target of [title,sign]){const heart=document.createElement('span');heart.className='spark-heart';heart.setAttribute('aria-hidden','true');heart.textContent='💖';target.append(' ',heart)}}launchHearts(source);launchConfetti();modal.classList.add('is-visible');setTimeout(()=>document.getElementById('close').focus(),120)}
    function closeLetter(){modal.classList.remove('is-visible');celebration.replaceChildren()}
    function showLocked(day){note.textContent=`calma aí , essa cartinha só acorda em ${String(day).padStart(2,'0')}/08 ☀️`;note.classList.add('is-visible');setTimeout(()=>note.classList.remove('is-visible'),2600)}
    document.getElementById('wake').addEventListener('click',()=>{morning.classList.add('is-awake');opening.classList.add('is-leaving');setTimeout(()=>{opening.style.display='none';screen.classList.add('is-visible')},2500)});
    document.getElementById('close').addEventListener('click',closeLetter);modal.addEventListener('click',e=>{if(e.target===modal)closeLetter()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLetter()});buildCalendar();
  </script>
</body>
